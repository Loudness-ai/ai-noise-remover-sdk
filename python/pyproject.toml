[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loudness-audio-kit"
version = "1.0.1"
description = "Local speech denoising, enhancement, loudness normalization, audio conversion and measurement for Python."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "LicenseRef-Loudness-Audio-Kit-Distribution"
license-files = ["LICENSE", "DISTRIBUTION-LICENSE", "NOTICE", "third-party/DeepFilterNet/LICENSE*", "third-party/deepfilter-stream/LICENSE", "third-party/deepfilter-stream/NOTICE"]
authors = [{name = "Loudness.ai"}]
keywords = ["audio", "noise-removal", "speech-enhancement", "loudness", "offline", "ffmpeg"]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "onnxruntime==1.30.0", "psutil>=5.9,<8"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://loudness.ai/developers/ai-noise-remover-sdk/"
Documentation = "https://loudness.ai/developers/guides/install-ai-noise-remover-sdk/"
"Browser demo" = "https://huggingface.co/spaces/Loudness-ai/ai-noise-remover-loudness-normalizer"
Repository = "https://github.com/Loudness-ai/ai-noise-remover-sdk"
Issues = "https://github.com/Loudness-ai/ai-noise-remover-sdk/issues"

[project.scripts]
loudness-audio = "loudness_audio_kit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "mypy>=1.15", "build>=1.2", "twine>=6", "pip-audit>=2.9", "types-psutil"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loudness_audio_kit = ["py.typed", "models/dfn3-512-v1/*", "brand/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*", "onnxruntime.*"]
ignore_missing_imports = true
